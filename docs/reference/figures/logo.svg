<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 200" width="174" height="200">
  <!-- powerape hex sticker: ape above a rising power curve -->
  <polygon points="87,1 172,50.5 172,149.5 87,199 2,149.5 2,50.5"
           fill="#1b4332" stroke="#74c69d" stroke-width="4" stroke-linejoin="round"/>

  <!-- target power line (dotted) -->
  <line x1="26" y1="112" x2="148" y2="112" stroke="#74c69d"
        stroke-width="1.5" stroke-dasharray="3,5"/>

  <!-- power curve -->
  <path d="M 26 150 C 58 150, 64 116, 90 112 C 114 108.5, 132 107.5, 146 107"
        fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="112" r="3.5" fill="#ffd166"/>

  <!-- ape -->
  <circle cx="58" cy="60" r="9" fill="#95d5b2"/>
  <circle cx="116" cy="60" r="9" fill="#95d5b2"/>
  <circle cx="87" cy="64" r="27" fill="#95d5b2"/>
  <ellipse cx="87" cy="71" rx="19" ry="14" fill="#d8f3dc"/>
  <rect x="68" y="54" width="38" height="9" rx="4" fill="#95d5b2"/>
  <circle cx="79" cy="68" r="3.2" fill="#1b4332"/>
  <circle cx="95" cy="68" r="3.2" fill="#1b4332"/>
  <circle cx="83.5" cy="79" r="1.6" fill="#1b4332"/>
  <circle cx="90.5" cy="79" r="1.6" fill="#1b4332"/>
  <path d="M 80 84 Q 87 88.5 94 84" fill="none" stroke="#1b4332"
        stroke-width="1.6" stroke-linecap="round"/>

  <!-- name -->
  <text x="87" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="700" letter-spacing="0.5" fill="#d8f3dc">powerape</text>
</svg>
